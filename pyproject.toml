[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cycling-coach"
version = "0.1.0"
description = "Local Intervals.icu MCP tools for a cycling coach"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "mcp>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
ai-cycling-coach = "ai_cycling_coach.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
